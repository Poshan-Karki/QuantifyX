[pytest]
# Tests import the app modules (verdict, schema, main, ...) as top-level names.
# pythonpath puts the backend root on sys.path so those imports resolve without
# needing an installed package or sys.path hacks.
#
# Two suites, both run by CI:
#   tests/          the application, plus the shared regime primitives
#   research/tests/ the offline study -- arms, folds, metrics, and the leakage
#                   assertions that keep the experiment honest
#
# They are separate directories because the study tests belong with the study:
# if research/ is ever extracted to its own repository, its tests travel with
# it and this line loses one entry.
testpaths = tests research/tests
pythonpath = .
